name: careerpilot

# Code-execution sandbox for the agents. Never started by `docker compose up`
# (it's behind a profile); agents/sandbox/session.py starts one throwaway
# container per search (shared by all portals) with
# `docker compose run -d --rm sandbox`.
x-sandbox: &sandbox
  image: careerpilot-sandbox:latest
  build:
    context: agents/sandbox
  profiles: [sandbox]
  command: ["sleep", "infinity"] # commands are run with `docker exec`
  labels:
    careerpilot.sandbox: "1"

  # Hardening
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  working_dir: /workspace
  tmpfs:
    - /workspace:size=2g,uid=1000,gid=1000
    - /tmp:size=1g

  # Resource limits. Scraping + pandas fits in 4g; the rest of the RAM is left
  # for Ollama, which keeps the CPU-offloaded half of gpt-oss-20b there.
  mem_limit: 4g
  shm_size: 1g
  cpus: 4
  pids_limit: 512

  # The LLM is not used in here: it runs on the host in Ollama (just start_llm).
  environment:
    HOME: /workspace # root fs is read-only; pip/torch caches go to the tmpfs
    PYTHONUNBUFFERED: "1"

services:
  # Needs the NVIDIA Container Toolkit on the host.
  sandbox:
    <<: *sandbox
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # or device_ids: ["0"]
              capabilities: [gpu]

  # Same sandbox without GPU or torch, for machines without the NVIDIA toolkit.
  sandbox-cpu:
    <<: *sandbox
    image: careerpilot-sandbox:cpu
    build:
      context: agents/sandbox
      args:
        BASE_IMAGE: ubuntu:24.04
        WITH_TORCH: "0"
