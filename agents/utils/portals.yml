# portals.yml — Job Portal and Company Scan Configuration
# Used by: /career-ops scan
# Profile: Ashkan Nikfarjam — ML/AI/Platform Engineer, Bay Area
#
# Levels:
#   0 — Local parser (zero-token, if script exists)
#   1 — Playwright (direct company careers page)
#   2 — ATS API (Greenhouse / Ashby / Lever / Workday)
#   3 — WebSearch queries (portal-wide discovery)

# ─────────────────────────────────────────────────────────
# TITLE FILTER
# At least 1 positive keyword must match; 0 negative keywords.
# ─────────────────────────────────────────────────────────
title_filter:
  # NOTE (2026-07-01): tightened from bare single-word terms ("engineer", "AI", "ML",
  # "backend", "platform", "infrastructure", "software engineer", etc.) which matched
  # almost any tech role at any tracked company. Positive keywords now require an
  # actual AI/ML/bio domain signal, matching config/profile.yml target_roles + archetypes.
  positive:
    - "machine learning engineer"
    - "ml engineer"
    - "ai engineer"
    - "applied ai"
    - "applied scientist"
    - "ai platform"
    - "ml platform"
    - "mlops"
    - "llmops"
    - "ai infrastructure"
    - "ml infrastructure"
    - "llm engineer"
    - "llm"
    - "inference engineer"
    - "generative ai"
    - "foundation model"
    - "forward deployed"
    - "research engineer"
    - "computational biology"
    - "computational biologist"
    - "bioinformatics"
    - "genomics"
    - "full-stack ai"
    - "full stack ai"
    - "agentic"
    - "ai agent"
  negative:
    - "intern"
    - "director"
    - " VP "
    - "vice president"
    - "head of"
    - "chief"
    - "people manager"
    - "account executive"
    - "account manager"
    - "sales"
    - "marketing"
    - "recruiter"
    - "talent"
    - " hr "
    - "finance"
    - "legal"
    - "counsel"
    - "business development"
    - "customer success"
    - "solutions consultant"
  seniority_boost:
    - "senior"
    - "staff"
    - "lead"
    - "sr."
    - "sr "
    - "mid-level"
    - "mid level"
    - "ii "
    - " iii "

# ─────────────────────────────────────────────────────────
# LOCATION FILTER
# block takes precedence over allow.
# Empty location field always passes (don't penalize missing data).
# ─────────────────────────────────────────────────────────
location_filter:
  block:
    - "london"
    - "united kingdom"
    - " uk "
    - "berlin"
    - "germany"
    - "paris"
    - "france"
    - "toronto"
    - "canada"
    - "australia"
    - "singapore"
    - "india"
    - "amsterdam"
    - "netherlands"
    - "zurich"
    - "switzerland"
    - "dublin"
    - "ireland"
    - "tel aviv"
    - "israel"
    - "stockholm"
    - "sweden"
    - "oslo"
    - "norway"
    - "warsaw"
    - "poland"
    - "beijing"
    - "shanghai"
    - "hong kong"
    - "tokyo"
    - "japan"
    - "korea"
  allow:
    - "remote"
    - "san francisco"
    - "bay area"
    - "silicon valley"
    - "california"
    - "new york"
    - "nyc"
    - "seattle"
    - "austin"
    - "boston"
    - "chicago"
    - "denver"
    - "atlanta"
    - "united states"
    - " us "
    - "usa"
    - "hybrid"
    - "distributed"
    - "anywhere"

# ─────────────────────────────────────────────────────────
# SEARCH QUERIES — WebSearch portal sweep (Level 3)
# Covers job boards that don't have direct parsers.
# Runs in parallel. Results are deduplicated against tracked_companies.
# ─────────────────────────────────────────────────────────
search_queries:

  # ── Ashby (startup-heavy ATS) ──────────────────────────
  - name: "Ashby — ML/AI Engineer"
    query: 'site:jobs.ashbyhq.com "ML Engineer" OR "Machine Learning Engineer" OR "AI Engineer"'
    enabled: true

  - name: "Ashby — AI Platform/MLOps"
    query: 'site:jobs.ashbyhq.com "AI Platform" OR "MLOps" OR "LLMOps" OR "ML Platform" OR "AI Infrastructure"'
    enabled: true

  - name: "Ashby — LLM/Inference Engineer"
    query: 'site:jobs.ashbyhq.com "LLM Engineer" OR "Inference Engineer" OR "Foundation Model" OR "Generative AI Engineer"'
    enabled: true

  - name: "Ashby — Backend/Full-Stack AI"
    query: 'site:jobs.ashbyhq.com ("Backend Engineer" OR "Software Engineer" OR "Full Stack") (AI OR ML OR "machine learning")'
    enabled: true

  - name: "Ashby — Bioinformatics"
    query: 'site:jobs.ashbyhq.com "Bioinformatics" OR "Computational Biology" OR "Genomics Software"'
    enabled: true

  - name: "Ashby — Research Engineer"
    query: 'site:jobs.ashbyhq.com "Research Engineer" OR "Applied Scientist" OR "ML Research"'
    enabled: true

  # ── Greenhouse (scale-ups and mid-size) ───────────────
  - name: "Greenhouse — ML/AI Engineer"
    query: 'site:job-boards.greenhouse.io "ML Engineer" OR "Machine Learning Engineer" OR "AI Engineer"'
    enabled: true

  - name: "Greenhouse — AI Platform/MLOps"
    query: 'site:job-boards.greenhouse.io "AI Platform" OR "MLOps" OR "LLMOps" OR "ML Infrastructure" OR "AI Infrastructure"'
    enabled: true

  - name: "Greenhouse — LLM/Foundation Model"
    query: 'site:job-boards.greenhouse.io "LLM" OR "Large Language Model" OR "Foundation Model" OR "Generative AI" engineer'
    enabled: true

  - name: "Greenhouse — Data/Platform Engineer AI"
    query: 'site:job-boards.greenhouse.io ("Data Engineer" OR "Platform Engineer" OR "Backend Engineer") (AI OR ML OR "machine learning")'
    enabled: true

  - name: "Greenhouse — Bioinformatics"
    query: 'site:job-boards.greenhouse.io "Bioinformatics" OR "Computational Biology" OR "Genomics" OR "Computational Biologist"'
    enabled: true

  - name: "Greenhouse — Research Engineer"
    query: 'site:job-boards.greenhouse.io "Research Engineer" OR "Applied Scientist" OR "Research Scientist" (AI OR ML)'
    enabled: true

  - name: "Greenhouse EU — ML/AI"
    query: 'site:job-boards.eu.greenhouse.io "ML Engineer" OR "AI Engineer" OR "Machine Learning" remote'
    enabled: true

  # ── Lever ──────────────────────────────────────────────
  - name: "Lever — ML/AI Engineer"
    query: 'site:jobs.lever.co "ML Engineer" OR "Machine Learning Engineer" OR "AI Engineer"'
    enabled: true

  - name: "Lever — MLOps/LLM/Platform"
    query: 'site:jobs.lever.co "MLOps" OR "AI Platform" OR "LLM" OR "ML Platform" OR "LLMOps"'
    enabled: true

  - name: "Lever — Data/Backend AI"
    query: 'site:jobs.lever.co ("Data Engineer" OR "Backend Engineer" OR "Platform Engineer") (AI OR ML)'
    enabled: true

  - name: "Lever — Bioinformatics"
    query: 'site:jobs.lever.co "Bioinformatics" OR "Computational Biology" OR "Genomics Engineer"'
    enabled: true

  # ── Indeed ─────────────────────────────────────────────
  - name: "Indeed — ML Engineer Remote/SF"
    query: 'site:indeed.com "Machine Learning Engineer" (remote OR "San Francisco" OR "Bay Area") -intern'
    enabled: true

  - name: "Indeed — AI Engineer Remote"
    query: 'site:indeed.com "AI Engineer" (remote OR "San Francisco" OR "Bay Area") -intern -director'
    enabled: true

  - name: "Indeed — MLOps/AI Platform"
    query: 'site:indeed.com "MLOps Engineer" OR "AI Platform Engineer" OR "ML Infrastructure" remote'
    enabled: true

  - name: "Indeed — LLMOps/LLM Engineer"
    query: 'site:indeed.com "LLMOps" OR "LLM Engineer" OR "AI Infrastructure Engineer" remote'
    enabled: true

  - name: "Indeed — Bioinformatics Engineer"
    query: 'site:indeed.com "Bioinformatics Software Engineer" OR "Computational Biology" OR "Genomics Software" (remote OR "San Francisco")'
    enabled: true

  - name: "Indeed — Senior ML/AI Bay Area"
    query: 'site:indeed.com "Senior Machine Learning" OR "Senior AI Engineer" OR "Staff ML Engineer" "Bay Area" OR California'
    enabled: true

  # ── ZipRecruiter ────────────────────────────────────────
  - name: "ZipRecruiter — ML/AI Engineer"
    query: 'site:ziprecruiter.com "Machine Learning Engineer" OR "AI Engineer" (remote OR "San Francisco" OR "Bay Area")'
    enabled: true

  - name: "ZipRecruiter — MLOps/AI Platform"
    query: 'site:ziprecruiter.com "MLOps Engineer" OR "AI Platform Engineer" OR "ML Platform" remote'
    enabled: true

  - name: "ZipRecruiter — LLM/AI Infrastructure"
    query: 'site:ziprecruiter.com "LLM" OR "LLMOps" OR "AI Infrastructure" engineer remote'
    enabled: true

  - name: "ZipRecruiter — Bioinformatics"
    query: 'site:ziprecruiter.com "Bioinformatics Engineer" OR "Computational Biology" (remote OR California)'
    enabled: true

  # ── LinkedIn ────────────────────────────────────────────
  - name: "LinkedIn — ML/AI Engineer SF"
    query: 'site:linkedin.com/jobs "Machine Learning Engineer" OR "AI Engineer" "San Francisco"'
    enabled: true

  - name: "LinkedIn — Remote ML/AI Senior"
    query: 'site:linkedin.com/jobs ("Senior ML Engineer" OR "Staff ML Engineer" OR "Senior AI Engineer") remote'
    enabled: true

  - name: "LinkedIn — MLOps/LLMOps Remote"
    query: 'site:linkedin.com/jobs "MLOps" OR "LLMOps" OR "AI Platform Engineer" (remote OR "San Francisco")'
    enabled: true

  - name: "LinkedIn — Bioinformatics Software"
    query: 'site:linkedin.com/jobs "Bioinformatics Software Engineer" OR "Computational Biology" (remote OR "San Francisco")'
    enabled: true

  # ── Wellfound / AngelList (startups) ────────────────────
  - name: "Wellfound — ML/AI Engineer"
    query: 'site:wellfound.com "Machine Learning Engineer" OR "AI Engineer" OR "ML Engineer"'
    enabled: true

  - name: "Wellfound — MLOps/AI Platform"
    query: 'site:wellfound.com "MLOps" OR "AI Platform" OR "LLM Engineer" OR "Inference Engineer"'
    enabled: true

  - name: "Wellfound — Full-Stack AI"
    query: 'site:wellfound.com ("Full Stack" OR "Backend Engineer") (AI OR ML OR "machine learning")'
    enabled: true

  # ── Glassdoor ───────────────────────────────────────────
  - name: "Glassdoor — ML/AI Engineer"
    query: 'site:glassdoor.com "Machine Learning Engineer" OR "AI Engineer" ("San Francisco" OR remote)'
    enabled: true

  - name: "Glassdoor — MLOps/AI Platform"
    query: 'site:glassdoor.com "MLOps" OR "AI Platform" OR "LLM Engineer" remote'
    enabled: true

  # ── Built In (tech-focused) ─────────────────────────────
  - name: "Built In SF — ML/AI"
    query: 'site:builtin.com "Machine Learning Engineer" OR "AI Engineer" OR "MLOps" "San Francisco"'
    enabled: true

  - name: "Built In — Remote ML/AI"
    query: 'site:builtin.com "Machine Learning Engineer" OR "AI Engineer" remote'
    enabled: true

  # ── Y Combinator ────────────────────────────────────────
  - name: "YC Jobs — ML/AI Engineer"
    query: 'site:ycombinator.com/jobs "ML Engineer" OR "AI Engineer" OR "Machine Learning"'
    enabled: true

  - name: "YC Jobs — MLOps/Platform"
    query: 'site:ycombinator.com/jobs "MLOps" OR "AI Platform" OR "LLM" OR "Inference"'
    enabled: true

  # ── Dice (tech job board) ───────────────────────────────
  - name: "Dice — ML/AI Engineer"
    query: 'site:dice.com "Machine Learning Engineer" OR "AI Engineer" OR "MLOps" (remote OR "San Francisco")'
    enabled: true

  # ── Hired ───────────────────────────────────────────────
  - name: "Hired — ML/AI"
    query: 'site:hired.com "Machine Learning Engineer" OR "AI Engineer" OR "ML Engineer"'
    enabled: true

  # ── Bioinformatics-specific portals ─────────────────────
  - name: "ISCB — Bioinformatics Jobs"
    query: 'site:careers.iscb.org "Software Engineer" OR "Bioinformatics" OR "Computational Biology"'
    enabled: true

  - name: "Bioinformatics.org — Jobs"
    query: 'site:bioinformatics.org/jobs "Software Engineer" OR "Bioinformatics"'
    enabled: true

  - name: "Nature Jobs — Computational Bio"
    query: 'site:nature.com/naturecareers "Bioinformatics" OR "Computational Biology" OR "Genomics" engineer'
    enabled: true

  # ── Google Careers direct ───────────────────────────────
  - name: "Google Careers — ML/AI"
    query: 'site:careers.google.com "ML Engineer" OR "Machine Learning" OR "AI Research" OR "Research Engineer"'
    enabled: true

  # ── SimplyHired ─────────────────────────────────────────
  - name: "SimplyHired — ML/AI Remote"
    query: 'site:simplyhired.com "Machine Learning Engineer" OR "AI Engineer" remote -intern'
    enabled: true

  # ── Joblist ─────────────────────────────────────────────
  - name: "Joblist — ML/AI"
    query: 'site:joblist.com "Machine Learning Engineer" OR "AI Engineer" OR "MLOps" remote'
    enabled: true

  # ── Remote-first job boards ─────────────────────────────
  - name: "Remote.co — ML/AI"
    query: 'site:remote.co "Machine Learning" OR "AI Engineer" OR "MLOps"'
    enabled: true

  - name: "We Work Remotely — ML/AI"
    query: 'site:weworkremotely.com "Machine Learning" OR "AI Engineer" OR "ML Engineer"'
    enabled: true

  - name: "Remotive — ML/AI"
    query: 'site:remotive.com "ML Engineer" OR "AI Engineer" OR "Machine Learning Engineer" OR "MLOps"'
    enabled: true


